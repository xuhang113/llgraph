name: Cloud Agent auto upgrade

on:
  schedule:
    # 北京时间每天 10:00、22:00（UTC 02:00、14:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: cloud-agent-auto-upgrade
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.error, urllib.request

          key = os.environ.get("CURSOR_API_KEY", "").strip()
          if not key:
              print("缺少仓库 Secret: CURSOR_API_KEY", file=sys.stderr)
              sys.exit(1)

          body = {
              "name": "llgraph auto upgrade",
              "prompt": {
                  "text": (
                      "你在仓库 xuhang113/llgraph 的 cursor/auto_upgrade 分支上工作。"
                      "这是专门给 Agent 自由发挥的长期实验分支，不是保守热修分支。\n"
                      "直接在当前分支提交，不要开新分支，不要创建 PR/MR。\n\n"
                      "产品定位：llgraph 是终端侧的 Cursor 式 Agent（LangGraph ReAct +"
                      " OpenAI 兼容网关 + CLI/Web Console）。对照文档 docs/cursor-agent.md、"
                      "docs/项目结构.md、docs/模块说明.md。对标市面商用 Agent："
                      "Cursor Agent、Claude Code、Codex CLI、Gemini CLI 等，"
                      "目标是让 llgraph 在真实改代码场景里越来越接近它们。\n\n"
                      "本轮北星（按影响力选一件做深，允许为此做大范围重构）：\n"
                      "1. 速度：首 token、工具循环、检索、索引、上下文组装、启动耗时。\n"
                      "2. 性能：token 浪费、重复读文件、无效工具调用、上下文膨胀、并发/批处理。\n"
                      "3. 稳定性：工具失败恢复、死循环、会话损坏、压缩丢上下文、并发竞态、崩溃。\n"
                      "4. 商用体验：计划/多 Agent、记忆连续性、改码命中率、MCP/Skills/Rules、"
                      "可观测性、CLI/Web 交互是否像成熟产品。\n\n"
                      "工作方式：\n"
                      "- 先 git log / git diff origin/main...HEAD，看本分支已有方向，接着做，不要推倒重来。\n"
                      "- 先定位当前相对商用 Agent 最大的一个缺口，再下手；一次提交围绕同一个主题。\n"
                      "- 允许重构模块边界、重写热点路径、删掉过时抽象；不要为了炫技无关 rename/纯格式化。\n"
                      "- 改完必须让相关测试通过；没有测试的核心路径要补最小回归测试。\n"
                      "- 提交后分支仍可安装、可启动 Agent（pip install -e 与现有 CLI 入口不要弄坏）。\n"
                      "- 提交信息写清：对标了什么、为什么更快/更稳、怎么验证。\n"
                      "- 若判断本轮没有高价值改动，不要硬改，在总结里写下一步该攻哪。\n"
                  )
              },
              "repos": [
                  {
                      "url": "https://github.com/xuhang113/llgraph",
                      "startingRef": "cursor/auto_upgrade",
                  }
              ],
              "workOnCurrentBranch": True,
              "autoCreatePR": False,
          }

          req = urllib.request.Request(
              "https://api.cursor.com/v1/agents",
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Basic "
                  + base64.b64encode(f"{key}:".encode()).decode(),
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read().decode("utf-8")
          except urllib.error.HTTPError as e:
              print(e.read().decode("utf-8", errors="replace"), file=sys.stderr)
              sys.exit(1)

          print(raw)
          url = (json.loads(raw).get("agent") or {}).get("url")
          if url:
              print(f"Agent URL: {url}")
          PY
