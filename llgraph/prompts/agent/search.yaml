# 检索策略（动态段；勿堆进任务执行长禁令）

tool_routing: |
  ## 代码检索路由
  | 信号 | 第一步 | 随后 |
  | 广搜 / 业务链路 / 多模块摸底 / 不知从哪下手 | `spawn_subagent(kind="explore")` | 主会话读摘要后精读/作答 |
  | 字面量（字段/类/表/URL 片段）针点 | `grep_files(pattern="a\|b\|c", path=".")` | 批量 `read_files` |
  | 已知文件名 glob | `glob_files` | 宽段 `read_file` |
  | 针点且不知在哪（未 spawn） | `search_code_parallel` ×1 | grep → read |
  | 列仓库（针点定位用） | `list_directory(".")` 一次 | grep |
  | 更早会话细节 | `search_session_history` | 归档 `read_file` |

  `path` 必须来自工具输出或 `"."`。针点任务批量调工具。排查时按提纲搜/读，勿只扫用户原文字面量。
  已决定 spawn 时：主会话本回合不要再发起广搜用的 `search_code_parallel` / 大批量 `read_files`。

anti_patterns: |
  ## 禁止
  1. 同一用户问题里第二次 `search_code_parallel`
  2. 循环猜仓库目录名
  3. 同一宽 pattern 反复全仓 grep（已折叠结果已含真实总数，勿再用同一 pattern 硬刷）
  4. 用列目录代替内容检索
  5. 串行单词 grep / 窄段反复 read
  6. 未整理提纲就原文硬搜并第一命中结案；或验证时无限新开线

path_scope: |
  `path` 是检索子树根（相对工作区）。跨仓默认 `"."`。禁止 `"../"`。

code_search: |
  并行检索给线索；行级证据靠 grep；深入理解靠 `read_files` / 宽段 `read_file`。

batch_read: |
  多路径 → 一次 `read_files`（≤8）。连续区间 → 一次宽段 `read_file`（常 80–300 行）。不连续区间 → 同条消息并行多个 `read_file`。

batch_search: |
  多关键词 → 一条 `pattern="A|B|C"`。表名 + DO + Mapper + 字段名可合并。
  grep_files 默认 auto：命中过多会折叠为「真实总数 + 按文件计数 + 少量样例」，
  请收窄 path/file_glob 后再搜，或对候选文件 read_files；禁止同一宽 pattern 再全仓 grep。
  明确要逐行时用 output_mode=content 且缩小范围；只要路径用 files；只要总数用 count。

search_index_ready: |
  代码索引可用。不知位置时可选用 `search_code_parallel`（每问 ≤1）。发现文件勿用 shell ls/find/grep/cat。

search_no_index: |
  尚未建索引（`llgraph index -C .`）。链路：glob → grep → read。禁用并行/语义检索工具。

glob_grep_miss_tail: |
  0 命中：放宽到 `path="."` 或文档；若已用过 parallel，只改 grep pattern——不要再 parallel。

tool_invoke_params: |
  参数：glob_files→glob_pattern+path；grep_files→pattern+path[+file_glob][+output_mode][+head_limit]；read_files→paths；read_file→path[+行段]；list_directory→path。
