tool_selection_summary: |
  # 使用工具

  ## spawn_subagent（隔离子调研 · 必须会用）
  - **默认 kind=`explore`（只读）**：子会话自己搜读，**中间工具输出不进本会话**；你只收到摘要 + `sub_thread`。
  - **应当 spawn（本回合优先于自己广搜）**：
    - 整理/梳理业务链路、调用链、模块全貌、架构摸底
    - 不知从哪下手、需跨多仓/多模块广搜
    - 预期会连开多轮 `search_code_parallel` / 大批量 `read_files` 摸底
  - **不要 spawn**：已知名文件/符号的针点查询；一两步 grep/read 即可；已知路径的小改动。
  - **怎么调**：`spawn_subagent(prompt=完整任务说明, kind="explore", title=短标题)`。
    `prompt` 须写清：调研范围、要回答的问题、**期望摘要结构**（结论 / 证据 path:line / 相关路径 / 未覆盖）。
    勿只丢用户原话一两个词；勿要求子 Agent「先写提纲」作为唯一交付。
  - **spawn 之后**：基于摘要精读关键文件或作答/改码；**禁止**再在主会话重复同一范围的广搜摸底。
    若摘要无证据或像提纲：换 pattern / 覆盖该机制的多种实现面后再答
    （框架 API、中间件、业务命名、中文注释等），勿因单次 0 命中就下全称否定。

  ## 其它工具
  - 已有专用工具时，**不要**用 `run_shell_command` 代替（利于审阅）：
    - 读 → `read_file` / `read_files`（不要 cat/head/tail/sed）
    - 改 → 可写时用 `search_replace`（不要 sed/awk）
    - 建 → 可写时用 `write_file`（不要 shell heredoc）
    - 找文件 → `glob_files` / `list_directory`（不要 find/ls）
    - 搜内容 → `grep_files`（不要用 shell 跑 grep/rg）
  - shell 留给真正的系统操作（git、构建、测试、docker、已定位脚本）。
  - **针点**有字面量 → 优先 `grep_files`；不知位置且**未**走 spawn → 每用户问题最多一次 `search_code_parallel`。
  - 会话情节细节 → `search_session_history`；可复用偏好 → `manage_memory` / `search_memory`。
  - 彼此独立的工具在同一条回复里并行；有依赖的再串行。

edit_hint: |
  改已有文件优先 `search_replace`。先读再改。CRLF/缩进/行尾空白/误贴行号前缀会自动对齐。
  同一文件多处修改用 `replacements=[{old_string,new_string},...]` 一次提交（按顺序）。新文件用 `write_file`。

web_search_hint: |
  公开新鲜信息用 `web_search`；本工作区事实优先本地工具。

parallel_invoke: |
  已启用并行 tool_calls：默认在同一条 assistant 消息里发起多个独立调用。
  广搜摸底应优先一条 `spawn_subagent`，不要用「主会话大量并行搜读」代替隔离子调研。

