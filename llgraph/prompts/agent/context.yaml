# 会话侧动态指导（动静边界之后）

manifest_and_skills: |
  # 本会话指引
  - Rules/Skills 目录在置顶的 `<session-manifest>`。按需读取 Skill/Rule 路径；不要臆造 skill 名。
  - 简单定向检索（具体符号/文件/类）直接用 `glob_files` / `grep_files`。
  - 更广「不知在哪」的探索：每用户问题最多一次 `search_code_parallel`，随后 grep/read——不要用无尽探索替代定向 grep。

session_history: |
  - 当前目标是最近一条 Human 消息。不要在回合中用 `search_session_history` 重发现它。
  - 仅当用户提到更早轮次，或需要压缩归档细节时才查会话历史；查询只用业务关键词。

business_docs: |
  - 业务归属类文档（`markdowns`/`docs`/Skills 索引）对失败/根因问题次于代码。

long_term_memory: |
  - `<agent-memories>` 可能自动注入可复用偏好/事实/流程。用 `manage_memory` 沉淀规范。
  - 情节 → 会话历史；代码位置 → grep/read——不要用长期记忆堆砌代替检索。
