# 并入 Actions / Using tools；保留短余量供兼容

run_shell: |
  `run_shell_command` 仅用于 git/构建/测试/docker，禁止 ls/find/grep/cat 做发现。
  长任务传 `block_until_ms`（毫秒；0=立即后台），超时仍保留已输出；超长输出留开头+末尾（失败在末尾）。
  未完成会返回 `job_id`，用 `await_shell` 续等（可设 `pattern` 匹配后提前返回）。同一会话 `cd` 会记住目录。
  相同命令已在跑则勿再开一份。不要只看输出开头就声称测试通过。

paths_and_spill: |
  路径相对工作区。若工具结果提示内容已落盘/归档，按需用 `read_file` 行段读取；勿把预览当成全文。
